name: sesame-brain
services:
  app:
    image: sesame-brain:${IMAGE_TAG:-1.0.0}
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:${HOST_PORT:-3360}:3000"
    volumes:
      - ./config/clients.json:/app/config/clients.json:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    cpus: 2
    mem_limit: 768m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: &logging
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
  db:
    image: postgres:16-bookworm
    command: ["postgres", "-c", "log_statement=none", "-c", "log_min_error_statement=panic", "-c", "log_parameter_max_length_on_error=0", "-c", "log_error_verbosity=terse"]
    environment:
      POSTGRES_USER: brain
      POSTGRES_DB: brain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    restart: unless-stopped
    cpus: 1
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U brain -d brain"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging
  testdb:
    profiles: [dev]
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: brain
      POSTGRES_DB: brain_test
      POSTGRES_PASSWORD: test-only
    tmpfs:
      - /var/lib/postgresql/data:size=256m
    cpus: 1
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U brain -d brain_test"]
      interval: 3s
      timeout: 3s
      retries: 10
    logging: *logging
  dev:
    profiles: [dev]
    image: node:22-bookworm-slim
    working_dir: /work
    user: "1000:1000"
    volumes:
      - .:/work
    environment:
      DATABASE_URL: postgres://brain:test-only@testdb:5432/brain_test
      BASE_URL: https://brain.arxsable.ai
      SESSION_SECRET: test-only-session
      TOKEN_PEPPER: test-only-pepper
      NODE_ENV: test
    depends_on:
      testdb:
        condition: service_healthy
    cpus: 2
    mem_limit: 2g
    command: ["npm","test"]
    logging: *logging
volumes:
  postgres:
